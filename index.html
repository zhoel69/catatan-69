<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notes App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;

    user-select: none;

    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 16px;
  }

  /* FORM */
  .form {
    background: #fff;
    padding: 14px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }

  input, textarea {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    font-size: 13px;
    outline: none;
  }

  textarea {
    resize: none;
  }

  input:focus, textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }

  button {
    margin-top: 10px;
    padding: 9px 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }

  .add {
    background: #2563eb;
    color: white;
  }

  .add:hover {
    background: #1e4fd6;
  }

  /* CARD */
  .card {
    background: #fff;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    margin-bottom: 10px;
    transition: 0.2s;
  }

  .card:hover {
    transform: translateY(-2px);
  }

  h3 {
    margin: 0 0 6px 0;
    font-size: 14px;
  }

  p {
    margin: 0;
    font-size: 13px;
    color: #555;
    white-space: pre-wrap;
  }

  .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .copy {
    background: #111827;
    color: white;
  }

  .delete {
    background: #dc2626;
    color: white;
  }

  .copy:hover,
  .delete:hover {
    transform: scale(1.03);
  }

  *:focus {
    outline: none !important;
  }
</style>
</head>

<body>

<div class="container">

  <!-- FORM -->
  <div class="form">
    <h3>Tambah Catatan</h3>
    <input id="title" placeholder="Judul..." />
    <textarea id="content" rows="3" placeholder="Isi catatan..."></textarea>
    <button class="add" onclick="addNote()">Tambah</button>
  </div>

  <!-- NOTES -->
  <div id="notes"></div>

</div>

<script>
/* 🔒 BLOCK RIGHT CLICK */
document.addEventListener("contextmenu", e => e.preventDefault());

/* 🔒 BLOCK COPY GLOBAL */
document.addEventListener("copy", e => e.preventDefault());

/* 🔒 BLOCK ZOOM */
document.addEventListener("wheel", function(e) {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", function(e) {
  if (e.scale !== 1) e.preventDefault();
}, { passive: false });

/* SUPABASE */
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const client = supabase.createClient(supabaseUrl, supabaseKey);

/* LOAD NOTES */
async function loadNotes() {
  const { data } = await client
    .from("notes")
    .select("*")
    .order("created_at", { ascending: false });

  document.getElementById("notes").innerHTML = "";
  data.forEach(renderNote);
}

/* ADD NOTE */
async function addNote() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  if (!title || !content) return;

  await client.from("notes").insert([{ title, content }]);

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";

  loadNotes();
}

/* DELETE NOTE */
async function deleteNote(id) {
  await client.from("notes").delete().eq("id", id);
  loadNotes();
}

/* COPY */
function copyText(text) {
  navigator.clipboard.writeText(text);
}

/* SAFE TEXT */
function escapeHtml(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

/* RENDER CARD */
function renderNote(note) {
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <h3>${escapeHtml(note.title)}</h3>
    <p>${escapeHtml(note.content)}</p>

    <div class="btn-group">
      <button class="copy" onclick="copyText(\`${note.content}\`)">Copy</button>
      <button class="delete" onclick="deleteNote('${note.id}')">Hapus</button>
    </div>
  `;

  document.getElementById("notes").appendChild(div);
}

/* INIT */
loadNotes();
</script>

</body>
</html>
